name: CI/CD for Static Site with GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # -------------------------------
  # Stage 1: Checkout
  # -------------------------------
  stage-1-checkout:
    name: 1️⃣ Checkout Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  # -------------------------------
  # Stage 2: Validate HTML
  # -------------------------------
  stage-2-validate-html:
    name: 2️⃣ Validate HTML Syntax
    runs-on: ubuntu-latest
    needs: stage-1-checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HTML Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML files
        run: |
          find ./docs -name '*.html' -exec tidy -qe {} \;


  # -------------------------------
  # Stage 3: Check Broken Links
  # -------------------------------
  stage-3-check-links:
    name: 3️⃣ Check for Broken Links
    runs-on: ubuntu-latest
    needs: stage-2-validate-html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linkchecker
        run: |
          sudo apt-get update
          sudo apt-get install -y linkchecker

      - name: Check links in website
        run: |
          linkchecker ./docs/index.html || true


  # -------------------------------
  # Stage 4: Build Preview
  # -------------------------------
  stage-4-build-preview:
    name: 4️⃣ Build Preview
    runs-on: ubuntu-latest
    needs: stage-3-check-links

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create website preview
        run: |
          zip -r site-preview.zip ./docs

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site-preview.zip


  # -------------------------------
  # Stage 5: Deploy to GitHub Pages
  # -------------------------------
  stage-5-deploy:
    name: 5️⃣ Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: stage-4-build-preview

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
